name: Windows-x64

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Windows'x64"
        default: "World"

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  Windows-x64:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install deps
      run: |
        cmake -DPDFIUM_BUILD_DIR=${{github.workspace}}/build-debug -P ${{github.workspace}}/.github/workflows/windows_deps.cmake

    - name: Configure CMake Debug
      run: |
        cmake -B ${{github.workspace}}/build-debug -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build-Debug
      run: cmake --build ${{github.workspace}}/build-debug --config ${{env.BUILD_TYPE}}
